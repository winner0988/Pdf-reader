[package]
name = "pdf-reader"
description = "Privacy-first, offline desktop PDF reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pdf_reader_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
ipc_contract = { path = "../crates/ipc_contract" }
worker_host = { path = "../crates/worker_host" }
# Native open dialog, called from Rust only (no dialog plugin is exposed to the WebView).
rfd = { version = "0.17.2", default-features = false }
# Already used by Tauri; only the oneshot channel of the render queue is needed here.
tokio = { version = "1", default-features = false, features = ["sync"] }
# Already used by Tauri: parses web links the way browsers do before one is opened (MVP-12).
url = "2"

[target.'cfg(windows)'.dependencies]
# ShellExecuteW, to hand a checked link to the default browser (src/opener.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
