[package]
name = "pdf-reader"
description = "Privacy-first, offline desktop PDF reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pdf_reader_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# A second launch hands its files to the running window as tabs (MVP-14, ADR 0012).
tauri-plugin-single-instance = "=2.5.0"
tauri.workspace = true
ipc_contract = { path = "../crates/ipc_contract" }
worker_host = { path = "../crates/worker_host" }
# Native message boxes: WebView2 missing, replacing exported files (the file dialogs are
# src/file_dialog.rs).
rfd = { version = "0.17.2", default-features = false }
# Already used by Tauri; only the oneshot channel of the render queue is needed here.
tokio = { version = "1", default-features = false, features = ["sync"] }
# Already used by Tauri: parses web links the way browsers do before one is opened (MVP-12).
url = "2"
# The recent files list (#73): its file in the app's data folder, and the salted hashes of the
# files not to record. All four are already used by Tauri or the contract crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
# The system's file dialogs, with an option rfd cannot set (#86, B2-04, src/file_dialog.rs).
# Already used by Tauri, in this version.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# ShellExecuteW, to hand a checked link to the default browser (src/opener.rs); ReplaceFileW and
# MoveFileExW, to put a saved document in its file's place (src/saving.rs, B2-02); WinHTTP, for
# the update check the user asks for, the app's one network request (src/update_check.rs, #64,
# ADR 0009).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


[lints]
workspace = true
