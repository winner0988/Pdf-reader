[package]
name = "pdf-reader"
description = "Privacy-first, offline desktop PDF reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pdf_reader_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
ipc_contract = { path = "../crates/ipc_contract" }
worker_host = { path = "../crates/worker_host" }
# Native open dialog, called from Rust only (no dialog plugin is exposed to the WebView).
rfd = { version = "0.17.2", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
