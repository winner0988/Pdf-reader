<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- PDF file icon at 20 px (UX-06, #730), drawn on this size's pixel grid: one unit is one pixel.
       Rebuild every icon file with `node scripts/release/app-icons.mjs` (docs/ux/visual-style.md, section 8.1). -->
  <!-- Page and folded corner: 1 px lines through the pixel centres -->
  <path d="M5.5 0.5H15.5L19.5 4.5V19.5H5.5Z" fill="#fffdfa" stroke="#8f8a82"/>
  <path d="M15.5 0.5V4.5H19.5Z" fill="#e6e2dd" stroke="#8f8a82" stroke-linejoin="round"/>
  <!-- Shield, the app icon's -->
  <path transform="translate(11 5) scale(0.01807) translate(-602 -721)" d="M602 558L762 633Q768 636 768 646C768 760 690 838 610 880Q602 884 594 880C514 838 436 760 436 646Q436 636 442 633Z" fill="#0256a9"/>
  <!-- Label, sticking out on the left -->
  <rect x="0" y="10" width="16" height="8" rx="1" fill="#0b65bf"/>
  <!-- "PDF": 4 x 6 px letters, 1 px strokes -->
  <g fill="#fcfaf7" shape-rendering="crispEdges">
    <rect x="1" y="11" width="3" height="1"/><rect x="1" y="12" width="1" height="1"/><rect x="4" y="12" width="1" height="1"/><rect x="1" y="13" width="1" height="1"/>
    <rect x="4" y="13" width="1" height="1"/><rect x="1" y="14" width="3" height="1"/><rect x="1" y="15" width="1" height="1"/><rect x="1" y="16" width="1" height="1"/>
    <rect x="6" y="11" width="3" height="1"/><rect x="6" y="12" width="1" height="1"/><rect x="9" y="12" width="1" height="1"/><rect x="6" y="13" width="1" height="1"/>
    <rect x="9" y="13" width="1" height="1"/><rect x="6" y="14" width="1" height="1"/><rect x="9" y="14" width="1" height="1"/><rect x="6" y="15" width="1" height="1"/>
    <rect x="9" y="15" width="1" height="1"/><rect x="6" y="16" width="3" height="1"/><rect x="11" y="11" width="4" height="1"/><rect x="11" y="12" width="1" height="1"/>
    <rect x="11" y="13" width="3" height="1"/><rect x="11" y="14" width="1" height="1"/><rect x="11" y="15" width="1" height="1"/><rect x="11" y="16" width="1" height="1"/>
  </g>
</svg>
