    <rect x="10" y="23" width="2" height="1"/><rect x="13" y="23" width="2" height="1"/><rect x="10" y="24" width="2" height="1"/><rect x="13" y="24" width="2" height="1"/>
    <rect x="10" y="25" width="4" height="1"/><rect x="17" y="19" width="5" height="1"/><rect x="17" y="20" width="2" height="1"/><rect x="17" y="21" width="2" height="1"/>
