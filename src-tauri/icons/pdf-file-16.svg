  <path d="M12.5 0.5V3.5H15.5Z" fill="#e6e2dd" stroke="#8f8a82" stroke-linejoin="round"/>
  <!-- Label, sticking out on the left -->
  <rect x="0" y="8" width="13" height="7" rx="0.5" fill="#0b65bf"/>
  <!-- "PDF": 3 x 5 px letters, 1 px strokes -->
  <g fill="#fcfaf7" shape-rendering="crispEdges">
    <rect x="1" y="9" width="3" height="1"/><rect x="1" y="10" width="1" height="1"/><rect x="3" y="10" width="1" height="1"/><rect x="1" y="11" width="3" height="1"/>
    <rect x="1" y="12" width="1" height="1"/><rect x="1" y="13" width="1" height="1"/><rect x="5" y="9" width="2" height="1"/><rect x="5" y="10" width="1" height="1"/>
    <rect x="7" y="10" width="1" height="1"/><rect x="5" y="11" width="1" height="1"/><rect x="7" y="11" width="1" height="1"/><rect x="5" y="12" width="1" height="1"/>
    <rect x="7" y="12" width="1" height="1"/><rect x="5" y="13" width="2" height="1"/><rect x="9" y="9" width="3" height="1"/><rect x="9" y="10" width="1" height="1"/>
    <rect x="9" y="11" width="2" height="1"/><rect x="9" y="12" width="1" height="1"/><rect x="9" y="13" width="1" height="1"/>
  </g>
</svg>
