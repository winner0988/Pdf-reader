name: Installer

# Builds the NSIS installer, installs it, and checks the installed pdf_worker (REL-01,
# docs/architecture/packaging.md). Slow (a second MuPDF build with the static runtime), so pull
# requests run it only when something that ends up in the installer changes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "scripts/release/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/installer.yml"
  workflow_dispatch:
  # The release (docs/release.md) builds, installs and checks the installer the same way.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Installer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: installer
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release script tests
        run: node --test scripts/release/*.test.mjs

      - name: Build installer
        run: pnpm bundle

      # DEC-04 (#112): the installer is not signed, so it comes with its SHA-256, which users check
      # with Get-FileHash (docs/architecture/packaging.md). Taken from the file as built, before
      # anything runs it.
      - name: Installer SHA-256
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          # The format of sha256sum: the hash, two spaces, the file name.
          [IO.File]::WriteAllText("$($installer.FullName).sha256", "$hash  $($installer.Name)`n")
          "SHA-256 of $($installer.Name): $hash"
          @(
            "### Installer",
            "",
            "| File | SHA-256 |",
            "|---|---|",
            "| ``$($installer.Name)`` | ``$hash`` |",
            "",
            "Not signed (DEC-04): check a copy with ``Get-FileHash -Algorithm SHA256 <file>``."
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # REL-02: the installer never downloads WebView2. Tauri's template keeps the code of every
      # install mode behind compile-time !if checks, so check the mode this installer was built
      # with (tauri.conf.json; check-security-config.mjs enforces the setting too). For "skip"
      # Tauri leaves the define empty; the two bootstrapper modes download the runtime.
      - name: Installer never downloads WebView2
        run: |
          $define = Select-String -Path target/release/nsis/x64/installer.nsi -Pattern '^!define INSTALLWEBVIEW2MODE "(.*)"' | Select-Object -First 1
          if (-not $define) { throw "INSTALLWEBVIEW2MODE is missing from the generated installer script" }
          $mode = $define.Matches[0].Groups[1].Value
          if ($mode -in 'downloadBootstrapper', 'embedBootstrapper') { throw "the installer downloads WebView2 ('$mode'; REL-02)" }
          "WebView2 install mode: '$mode' (empty means skip)"

      # REL-06 (#203): the wizard speaks the app's language: Traditional Chinese for a Chinese
      # Windows and for any language that is not listed (the first one), English for an English one.
      - name: Installer is in the app's language
        run: |
          $languages = Select-String -Path target/release/nsis/x64/installer.nsi -Pattern '^!insertmacro MUI_LANGUAGE "(.*)"' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (($languages -join ',') -ne 'TradChinese,English') { throw "installer languages: $($languages -join ', ')" }
          "installer languages: $($languages -join ', ')"

      - name: Installer contains the worker, the OCR language data, the licence and the notices
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $listing = 7z l $installer.FullName
          $listing
          if (-not ($listing -match '\bpdf_worker\.exe$')) { throw "pdf_worker.exe is not in $($installer.Name)" }
          # REL-04, ADR 0011: handing the installer to anyone comes with the licence and the notices.
          foreach ($name in 'LICENSE', 'THIRD_PARTY_LICENSES.txt') {
            if (-not ($listing -match "(^|[\s\\/])$([regex]::Escape($name))$")) { throw "$name is not in $($installer.Name)" }
          }
          foreach ($name in 'eng', 'chi_tra') {
            if (-not ($listing -match "tessdata[\\/]$name\.traineddata$")) { throw "$name.traineddata is not in $($installer.Name)" }
          }

      - name: Install silently (per machine)
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $process = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exited with $($process.ExitCode)" }
          Get-ChildItem (Join-Path $env:ProgramFiles 'PDF Reader')

      # B2-10: the language data that came with the app is what the repository has (ADR 0015).
      - name: Installed with the OCR language data
        run: |
          $dir = Join-Path $env:ProgramFiles 'PDF Reader\tessdata'
          foreach ($name in 'eng', 'chi_tra') {
            $installed = Join-Path $dir "$name.traineddata"
            if (-not (Test-Path $installed)) { throw "$installed is missing" }
            $expected = (Get-FileHash "src-tauri/resources/tessdata/$name.traineddata" -Algorithm SHA256).Hash
            if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne $expected) { throw "$installed is not the repository's file" }
          }

      # REL-04: the licence and the notices that came with the app are the repository's files.
      - name: Installed with the licence and the notices
        run: |
          $dir = Join-Path $env:ProgramFiles 'PDF Reader'
          $files = @{ 'LICENSE' = 'LICENSE'; 'THIRD_PARTY_LICENSES.txt' = 'src/assets/THIRD_PARTY_LICENSES.txt' }
          foreach ($name in $files.Keys) {
            $installed = Join-Path $dir $name
            if (-not (Test-Path $installed)) { throw "$installed is missing" }
            if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne (Get-FileHash $files[$name] -Algorithm SHA256).Hash) { throw "$installed is not the repository's file" }
          }

      # REL-03: offered for .pdf ("Open with", Default apps), without taking over the default.
      - name: Registered as a PDF app
        run: |
          $classes = 'HKLM:\SOFTWARE\Classes'
          $command = (Get-ItemProperty "$classes\PdfReader.Document\shell\open\command").'(default)'
          if ($command -notmatch '\\pdf-reader\.exe" "%1"$') { throw "unexpected open command: $command" }
          if ($null -eq (Get-ItemProperty "$classes\.pdf\OpenWithProgids").'PdfReader.Document') { throw 'not in Open with' }
          $registered = (Get-ItemProperty 'HKLM:\SOFTWARE\RegisteredApplications').'PDF Reader'
          if ($registered -ne 'Software\PDF Reader\Capabilities') { throw "RegisteredApplications: $registered" }
          $association = (Get-ItemProperty 'HKLM:\SOFTWARE\PDF Reader\Capabilities\FileAssociations').'.pdf'
          if ($association -ne 'PdfReader.Document') { throw "Capabilities .pdf: $association" }
          $default = (Get-ItemProperty "$classes\.pdf" -ErrorAction SilentlyContinue).'(default)'
          if ($default -eq 'PdfReader.Document') { throw 'the installer took over the .pdf default' }
          "open command: $command; .pdf default left as: '$default'"

      - name: Installed programs need no VC++ redistributable
        run: |
          $exes = Get-ChildItem (Join-Path $env:ProgramFiles 'PDF Reader') -Filter *.exe |
            Where-Object Name -ne 'uninstall.exe' | ForEach-Object FullName
          node scripts/release/check-imports.mjs @exes
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # B2-10: the worker the installer put on disk (a static C runtime, built apart from the one
      # the tests use) reads a scan with the language data it put next to it.
      - name: Installed worker starts in the sandbox, opens and renders a PDF, and reads a scan
        run: |
          $worker = Join-Path $env:ProgramFiles 'PDF Reader\pdf_worker.exe'
          $languages = Join-Path $env:ProgramFiles 'PDF Reader\tessdata'
          cargo run --locked -p worker_host --bin worker_smoke -- $worker --ocr tests/corpus/benign/scanned-text.pdf $languages
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Uninstall removes the AppContainer profile
        run: |
          $dir = Join-Path $env:ProgramFiles 'PDF Reader'
          $profileDir = Join-Path $env:LOCALAPPDATA 'Packages\pdfreader.worker'
          if (-not (Test-Path $profileDir)) { throw "the smoke test did not create $profileDir" }
          # _?= runs the uninstaller in place so -Wait covers the whole uninstall.
          $process = Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "uninstaller exited with $($process.ExitCode)" }
          if (Test-Path $profileDir) { throw "$profileDir still exists after uninstalling" }
          # REL-03: nothing of the PDF app registration is left behind.
          $left = @(
            'HKLM:\SOFTWARE\Classes\PdfReader.Document',
            'HKLM:\SOFTWARE\Classes\Applications\pdf-reader.exe',
            'HKLM:\SOFTWARE\PDF Reader'
          ) | Where-Object { Test-Path $_ }
          if ($left) { throw "left after uninstalling: $($left -join ', ')" }
          if ($null -ne (Get-ItemProperty 'HKLM:\SOFTWARE\RegisteredApplications').'PDF Reader') { throw 'still in RegisteredApplications' }
          if ($null -ne (Get-ItemProperty 'HKLM:\SOFTWARE\Classes\.pdf\OpenWithProgids' -ErrorAction SilentlyContinue).'PdfReader.Document') { throw 'still in Open with' }

      # The file uploaded is the one the SHA-256 was taken from: installing and uninstalling it
      # changed nothing.
      - name: Installer still matches its SHA-256
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $expected = ((Get-Content -Raw "$($installer.FullName).sha256") -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 of $($installer.Name) is $actual, the .sha256 file says $expected" }
          "$($installer.Name) matches its .sha256"

      # For checking a build, not a release (DEC-04; distributing the installer is decided
      # separately): kept two weeks.
      - name: Upload the installer with its SHA-256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
