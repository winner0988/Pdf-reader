name: OCR POC

# The OCR POC of ADR 0015 (#99), option C: builds Tesseract and Leptonica from pinned sources
# (scripts/ocr-poc/build-tesseract.ps1) and recognises a scanned corpus page in the worker's own
# sandbox. Runs only when the POC's files change, i.e. on the POC's pull request: the owner chose
# not to add its build time to every CI run. Removed once ADR 0015 is decided.

on:
  pull_request:
    paths:
      - ".github/workflows/ocr-poc.yml"
      - "scripts/ocr-poc/**"
      - "crates/pdf_worker/examples/tesseract_probe.rs"
      - "crates/pdf_worker/tests/ocr_poc.rs"

permissions:
  contents: read

concurrency:
  group: ocr-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tesseract:
    name: OCR POC (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Downloads the pinned sources and language data (SHA-256 checked) and builds them.
      - name: Build Tesseract and Leptonica
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ocr-poc/build-tesseract.ps1
      - name: Recognise a scanned page in the sandbox
        shell: pwsh
        # The tests run the probes, which `--test ocr_poc` alone does not build.
        run: |
          $env:TESSERACT_POC_DIR = (Resolve-Path target/ocr-poc/install).Path
          cargo build -p pdf_worker --features tesseract-poc --locked --examples
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p pdf_worker --features tesseract-poc --locked --test ocr_poc -- --nocapture
