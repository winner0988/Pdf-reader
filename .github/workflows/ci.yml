name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Action versions are pinned to commit SHAs; Dependabot keeps them current.
# Jobs for Rust / frontend activate automatically once Cargo.toml / package.json
# exist (MVP-01). A job skipped by `if:` still reports success to required checks.

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          [ -f Cargo.toml ] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          [ -f package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Forbidden telemetry / network dependencies
        run: bash scripts/ci/check-forbidden.sh
      - name: ADR numbering and index
        run: bash scripts/ci/check-adr.sh
      - name: Test corpus is reproducible
        run: |
          python3 tests/corpus/generate.py
          if [ -n "$(git status --porcelain -- tests/corpus)" ]; then
            echo "::error::tests/corpus differs from generate.py output; run python tests/corpus/generate.py and commit"
            git status --short -- tests/corpus
            exit 1
          fi

  pr-hygiene:
    name: PR hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|test|refactor|perf|build|ci|chore|security|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(worker): render pages in child process'. Got: $TITLE"
            exit 1
          fi
      - name: Body links an issue
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) +#[0-9]+'; then
            echo "::error::PR body must link its work card, e.g. 'Closes #12' (one PR = one issue)."
            exit 1
          fi

  rust:
    name: Rust (Windows)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the exact toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Debug builds load the frontend from devUrl, so the Tauri crate compiles without `dist/`.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # The fuzz targets (fuzz/, QA-03) are built by cargo-fuzz with nightly Rust in the Fuzz
      # workflow; here they only have to compile. Same target dir: MuPDF is not built twice.
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --target-dir target

  e2e:
    name: E2E (Windows)
    needs: detect
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The release app next to its worker, as installed, but without building the installer.
      # The WebView2 runtime is part of the runner image; no browser or driver is downloaded.
      - name: Build the app
        run: pnpm e2e:build
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $runtime = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$runtime",
                  "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$runtime",
                  "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$runtime"
          $found = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv }
          if ($found) { "WebView2 runtime: $($found -join ', ')" } else { "::warning::No WebView2 runtime is registered" }
          "Session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId), interactive: $([Environment]::UserInteractive)"
      - name: E2E tests
        run: pnpm e2e
      # Only screenshots of tests/corpus files and the app's logs (docs/architecture/e2e.md).
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
