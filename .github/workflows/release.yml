name: Release

# REL-04 (docs/release.md). Pushing the tag v<version> builds the installer the way the Installer
# workflow does (it is that workflow, called), and makes a DRAFT release of it: the installer, its
# SHA-256 and the notes of CHANGELOG.md. A draft is seen by nobody else and is not what the app's
# update check reads; publishing it is the owner's button. Run by hand (workflow_dispatch), it
# does the checks and the build and makes no release. A pull request that changes this workflow
# or the release scripts runs the checks (not the build: the Installer workflow runs on its own).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Release checks
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Release script tests
        run: node --test scripts/release/*.test.mjs
      # One version in package.json, Cargo.toml and Cargo.lock; the tag is v<that version>; the
      # changelog has a dated section for it.
      - name: Version, tag and changelog agree
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release/check-version.mjs $env:TAG
      # The notices are what the dependencies of this commit give (ADR 0011): not an older file.
      - name: Third-party notices are up to date
        run: node scripts/release/third-party-licenses.mjs --check

  installer:
    name: Installer
    needs: checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/installer.yml

  draft:
    name: Draft release
    needs: installer
    # Only a tag makes a release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes the draft; `gh run download` reads the installer of this run.
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Download the installer of this run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name installer --dir installer
      # GitHub turns a space in the name of an asset into a dot, and the installer is called
      # "PDF Reader_<version>_x64-setup.exe": give it the name people will download it under, with a
      # .sha256 that names that file. The hash is the one the Windows job took from the file as built.
      - name: Name the installer and its SHA-256
        run: |
          set -euo pipefail
          ls -l installer
          built=(installer/*-setup.exe)
          test "${#built[@]}" -eq 1
          expected=$(cut -d' ' -f1 "${built[0]}.sha256")
          actual=$(sha256sum "${built[0]}" | cut -d' ' -f1)
          test "$expected" = "$actual"
          name="PDF-Reader_${TAG#v}_x64-setup.exe"
          mkdir release
          cp "${built[0]}" "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")
          cat "release/$name.sha256"
      - name: Write the notes
        run: |
          set -euo pipefail
          node scripts/release/release-notes.mjs "${TAG#v}" release/*-setup.exe.sha256 > notes.md
          cat notes.md
      - name: Make the draft
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "PDF Reader ${TAG#v}" --notes-file notes.md \
            release/*-setup.exe release/*-setup.exe.sha256
