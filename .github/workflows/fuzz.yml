name: Fuzz

# libFuzzer on the entry points hostile input reaches first (QA-03, docs/security/fuzzing.md):
# the IPC decoding on both sides of the worker boundary, opening a PDF with MuPDF, a font file
# cut into a text box and drawn (B2-31), encoding its pictures again for a compressed copy (B3-01),
# and making a PDF of any other file (B3-03).
# Weekly for 20 minutes per target; pull requests that touch the targets or the code they test run a
# short smoke run.
#
# This repository is public, and so are its Actions logs and artifacts (#57). A crash sample may
# be a working exploit, so the fuzzer's output never reaches the log: it goes to fuzz.log, the
# log and the job summary only show statistics, and crash samples are uploaded only encrypted to
# the owner's age recipient in .github/fuzz-recipient.txt. Without a recipient nothing is
# uploaded.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/ipc_contract/**"
      - "crates/pdf_worker/**"
      - "tests/corpus/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [worker_messages, open_document, text_box_font, compress_images, create_pdf, exif_clean]
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '120' || '1200' }}
      # MuPDF and its C libraries get coverage and AddressSanitizer like the Rust code. Only
      # CFLAGS: libFuzzer itself (C++, built with CXXFLAGS) must not instrument itself. MuPDF's
      # Makefile passes its C flags to its few C++ files too, so they need clang++ as well.
      CC: clang
      CXX: clang++
      CFLAGS: -fsanitize=fuzzer-no-link,address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .cargo/config.toml points bindgen at LLVM's Windows location unless these are set.
      - name: Use the runner's clang for bindgen
        run: |
          echo "CLANG_PATH=$(command -v clang)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(llvm-config --libdir 2>/dev/null || dirname "$(find /usr/lib -name 'libclang.so*' | head -1)")" >> "$GITHUB_ENV"
      # Nightly for the sanitizers, the pinned stable for the seeds; both from the official Rust
      # sources. cargo-fuzz is pinned.
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          rustup toolchain install
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/worker_messages fuzz/corpus/open_document fuzz/corpus/text_box_font fuzz/corpus/compress_images fuzz/corpus/create_pdf fuzz/corpus/exif_clean
          env -u CC -u CXX -u CFLAGS cargo run --locked -q -p ipc_contract --bin fuzz_seeds -- fuzz/corpus/worker_messages
          # The generated test corpus (QA-01); the 200 MB files are only made on demand.
          find tests/corpus -name '*.pdf' -not -path '*/large/*' -exec cp {} fuzz/corpus/open_document/ \;
          cp fuzz/corpus/open_document/* fuzz/corpus/compress_images/
          cp fuzz/corpus/open_document/* fuzz/corpus/exif_clean/
          # Files to make a PDF of (B3-03): the first byte is the number of the kind of file, in the
          # order of KINDS in fuzz/fuzz_targets/create_pdf.rs.
          seed() { printf "\x$1" | cat - "$2" > "fuzz/corpus/create_pdf/$(basename "$2")"; }
          for file in tests/corpus/images/*; do seed 00 "$file"; done
          seed 01 tests/corpus/sources/web-page.html
          seed 02 tests/corpus/sources/text.txt
          seed 03 tests/corpus/sources/book.epub
          seed 04 tests/corpus/sources/page.xps
          seed 05 tests/corpus/sources/picture.svg
          seed 06 tests/corpus/sources/letter.docx
          seed 06 tests/corpus/sources/bomb-declared-size.docx
          seed 07 tests/corpus/sources/sheet.xlsx
          seed 08 tests/corpus/sources/slides.pptx
      # Built separately so that compiler errors stay visible; the run step below prints nothing.
      - name: Build the fuzz target
        run: cargo +nightly fuzz build ${{ matrix.target }}
      # Real fonts to start from: the CJK fallback font the worker carries (its source is in the
      # cargo registry once the target is built) and the TrueType fonts of the runner. The files
      # are only read by the fuzzer; nothing of them is kept or uploaded.
      - name: Seed the font corpus
        if: matrix.target == 'text_box_font'
        run: |
          find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -path '*/mupdf-fonts-droid-*/fonts/*.ttf' \
            -exec cp {} fuzz/corpus/text_box_font/ \;
          # No `| head`: with pipefail, find would fail with SIGPIPE once head had enough.
          count=0
          while read -r font; do
            [ "$count" -ge 20 ] && break
            cp "$font" "fuzz/corpus/text_box_font/$(basename "$font")"
            count=$((count + 1))
          done < <(find /usr/share/fonts -name '*.ttf' -size -2M 2>/dev/null || true)
          ls fuzz/corpus/text_box_font | wc -l
      # AddressSanitizer reports, panic messages and crashing inputs (libFuzzer prints small ones
      # in Base64) go to fuzz.log only. A font is far larger than a message: the font target may
      # read seeds of up to 5 MiB, so that the fonts above are not cut off.
      - name: Fuzz
        run: |
          max_len=1048576
          if [ "${{ matrix.target }}" = text_box_font ]; then max_len=5242880; fi
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time="$FUZZ_SECONDS" -max_len="$max_len" -rss_limit_mb=4096 \
            -print_final_stats=1 > fuzz.log 2>&1
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo
            echo '| | |'
            echo '|---|---|'
            grep -Eo 'stat::number_of_executed_units: *[0-9]+' fuzz.log | tail -1 | sed 's/.*: */| Runs | /; s/$/ |/'
            grep -Eo 'stat::average_exec_per_sec: *[0-9]+' fuzz.log | tail -1 | sed 's/.*: */| Runs per second | /; s/$/ |/'
            grep -Eo 'cov: [0-9]+ ft: [0-9]+' fuzz.log | tail -1 | sed 's/cov: \([0-9]*\) ft: \([0-9]*\)/| Coverage (edges) | \1 |\n| Features | \2 |/'
            grep -Eo 'corp: [0-9]+/[0-9]+[a-zA-Z]*' fuzz.log | tail -1 | sed 's/corp: /| Corpus (inputs\/size) | /; s/$/ |/'
            grep -Eo 'stat::peak_rss_mb: *[0-9]+' fuzz.log | tail -1 | sed 's/.*: */| Peak memory (MB) | /; s/$/ |/'
            if ls fuzz/artifacts/${{ matrix.target }}/* >/dev/null 2>&1; then
              echo
              echo "**The fuzzer found a crash.** Details are not shown here: they are only uploaded encrypted, as fuzz-crash-${{ matrix.target }} (docs/security/fuzzing.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Only the holder of the private key can read the samples. The recipient file is public;
      # the private key never leaves the owner's machine.
      - name: Encrypt crash samples
        id: encrypt
        if: failure()
        run: |
          recipient=$(grep -Eo '^age1[0-9a-z]+$' .github/fuzz-recipient.txt | head -1 || true)
          if [ -z "$recipient" ]; then
            echo "::warning::The fuzzer failed, but .github/fuzz-recipient.txt has no age recipient, so nothing is uploaded. Reproduce locally (docs/security/fuzzing.md)."
            exit 0
          fi
          # Nothing to keep if an earlier step (the build) failed before fuzzing started.
          files=$(ls -d fuzz/artifacts fuzz.log 2>/dev/null || true)
          if [ -z "$files" ]; then
            exit 0
          fi
          # age from the Ubuntu archive (signed by Ubuntu), installed only when something failed.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age > /dev/null
          # shellcheck disable=SC2086 # $files is a list of paths without spaces
          tar -czf - $files | age -r "$recipient" -o fuzz-crash.tar.gz.age
          echo "file=fuzz-crash.tar.gz.age" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted crash samples
        if: failure() && steps.encrypt.outputs.file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz-crash.tar.gz.age
          retention-days: 7
          if-no-files-found: error
