# Every dependency PR needs the needs-security-review label (AGENTS.md).
# Minor/patch bumps are grouped per ecosystem to keep review load manageable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - needs-security-review

  # fuzz/ is a separate workspace that uses pdf_worker and ipc_contract via
  # path dependencies. When their dependencies are bumped, both lockfiles must
  # be updated in the same PR (#382).
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
      - needs-security-review
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
      cargo-same-crate:
        group-by: dependency-name

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
      - needs-security-review
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1; revisit when it supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
