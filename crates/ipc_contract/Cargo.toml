[package]
name = "ipc_contract"
description = "Message types shared by the frontend, main process and pdf_worker (single source of truth)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ts-rs = "12"

[dev-dependencies]
serde_json = "1"
