[package]
name = "pdf_worker"
description = "Low-privilege child process that is the only code linked against MuPDF (ADR 0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ipc_contract = { version = "0.1.0", path = "../ipc_contract" }
# Encodes exported pages as JPEG (#111): the binding has no JPEG writer. Pure Rust, no
# dependencies, and no `unsafe` without its `simd` feature, which stays off. MIT or Apache-2.0,
# and IJG for the parts ported from libjpeg (see deny.toml).
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
mupdf = { version = "=0.8.0", default-features = false, features = ["base14-fonts", "bundled-fonts-droid"] }
# The same crate `mupdf` builds on, called directly only to learn which password opened a
# document (src/owner_password.rs, #88). No features of its own: `mupdf` chooses them.
mupdf-sys = { version = "=0.8.0", default-features = false }
thiserror = "2"
# Clears the copy of the password that src/owner_password.rs hands MuPDF (already in the
# workspace through ipc_contract).
zeroize = "1.9"

[dev-dependencies]
# Reads tests/corpus/manifest.json (already in the workspace through ipc_contract).
serde_json = "1"
worker_host = { path = "../worker_host" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    # The signature verification POC of ADR 0014 (tests/signature_poc.rs).
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
] }
