[package]
name = "sandbox"
description = "Starts pdf_worker in a restricted Windows process: Job Object, Low integrity, exploit mitigations (ADR 0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
# Runs inside the sandbox during tests and reports what it is (not) allowed to do.
name = "sandbox_probe"
path = "src/bin/sandbox_probe.rs"
test = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
