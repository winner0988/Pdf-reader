# Fuzz targets (QA-03, docs/security/fuzzing.md). Built by cargo-fuzz with nightly Rust and
# libFuzzer; kept out of the main workspace, which builds with stable Rust.
[package]
name = "pdf-reader-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
ipc_contract = { path = "../crates/ipc_contract" }
pdf_worker = { path = "../crates/pdf_worker" }

[workspace]
members = ["."]

[[bin]]
name = "worker_messages"
path = "fuzz_targets/worker_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_document"
path = "fuzz_targets/open_document.rs"
test = false
doc = false
bench = false
