# Fuzz targets (QA-03, docs/security/fuzzing.md). Built by cargo-fuzz with nightly Rust and
# libFuzzer; kept out of the main workspace, which builds with stable Rust.
[package]
name = "pdf-reader-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
ipc_contract = { path = "../crates/ipc_contract" }
pdf_worker = { path = "../crates/pdf_worker" }

[workspace]
members = ["."]

# cargo-fuzz builds with overflow checks on; the shipped release build has them off. The font
# subsetter adds two u16 values without a check in name.rs (typst/subsetter#30): the sum wraps in
# the shipped build, which ends in a refused font, but panics here, and the fuzzer would stop at
# the first damaged name table and show nothing else. Overflow checks stay on for all our own
# code. `debug-assertions = true` is what makes cargo pass `overflow-checks=off` explicitly, which
# beats the `-Cdebug-assertions` that cargo-fuzz adds to every crate.
[profile.release.package.subsetter]
debug-assertions = true
overflow-checks = false

[[bin]]
name = "worker_messages"
path = "fuzz_targets/worker_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_document"
path = "fuzz_targets/open_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_box_font"
path = "fuzz_targets/text_box_font.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress_images"
path = "fuzz_targets/compress_images.rs"
test = false
doc = false
bench = false

[[bin]]
name = "create_pdf"
path = "fuzz_targets/create_pdf.rs"
test = false
doc = false
bench = false
