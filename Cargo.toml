[workspace]
resolver = "3"
members = ["src-tauri", "crates/pdf_worker", "crates/ipc_contract", "crates/sandbox", "crates/worker_host"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
tauri = "2.11"
tauri-build = "2.6"

[workspace.lints.rust]
# Unsafe code (MuPDF FFI, Windows sandboxing) must be opted into per module with a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Full debug info made the dev build output huge (PDB files of 140+ MB per binary, a shared
# target folder of 168 GB). Line tables keep file and line numbers in backtraces; a debugger
# can still step through code but cannot show local variables.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = true
