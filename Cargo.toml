[workspace]
resolver = "3"
members = ["src-tauri", "crates/pdf_worker", "crates/ipc_contract"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
tauri = "2.11"
tauri-build = "2.6"

[workspace.lints.rust]
# Unsafe code (MuPDF FFI, Windows sandboxing) must be opted into per module with a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
