[workspace]
resolver = "3"
members = ["src-tauri", "crates/pdf_worker", "crates/ipc_contract", "crates/sandbox", "crates/worker_host"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
tauri = "2.11"
tauri-build = "2.6"

[workspace.lints.rust]
# Unsafe code (MuPDF FFI, Windows sandboxing) must be opted into per module with a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Full debug info made the dev build output huge (PDB files of 140+ MB per binary, a shared
# target folder of 168 GB). Line tables keep file and line numbers in backtraces; a debugger
# can still step through code but cannot show local variables.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = true

# mupdf-sys 0.8.0 bundles MuPDF 1.27.2, whose OpenJPEG lacks an upstream bounds check in
# opj_j2k_read_sod (#539). This is v0.8.0 of messense/mupdf-rs plus one commit that applies the
# upstream fix when the crate is built; see docs/architecture/mupdf-binding.md. fuzz/Cargo.toml
# has the same patch and deny.toml allows this one repository. Remove all three when a
# mupdf-sys release bundles MuPDF 1.28.0 or later.
[patch.crates-io]
mupdf-sys = { git = "https://github.com/winner0988/mupdf-rs", rev = "31e8194dc379f53f1f6da2a0d6fd9ad759e76bc7" }
