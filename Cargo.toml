[workspace]
resolver = "3"
members = ["src-tauri", "crates/pdf_worker", "crates/ipc_contract", "crates/sandbox", "crates/worker_host"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
tauri = "2.11"
tauri-build = "2.6"

[workspace.lints.rust]
# Unsafe code (MuPDF FFI, Windows sandboxing) must be opted into per module with a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Full debug info made the dev build output huge (PDB files of 140+ MB per binary, a shared
# target folder of 168 GB). Line tables keep file and line numbers in backtraces; a debugger
# can still step through code but cannot show local variables.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = true

# mupdf and mupdf-sys are patched to our fork branch v0.8.0-mupdf-1.28, which upgrades
# MuPDF to 1.28.6, compiles out the Markdown reader (FZ_ENABLE_MD=0, #572), and applies
# upstream Tesseract model-loading bounds checks (#563, #577) and recognition fixes (#580),
# and upstream FreeType 2.15.0 fixes (#626).
# OpenJPEG (#539) and Little CMS (#562) fixes are already present in MuPDF 1.28.6.
# See docs/architecture/mupdf-binding.md. fuzz/Cargo.toml has the same patch and
# deny.toml allows this one repository. Remove the patches when releases on crates.io
# of mupdf and mupdf-sys bundle a MuPDF that includes Tesseract 5.5.4 and
# FreeType 2.15.0 or later.
[patch.crates-io]
mupdf = { git = "https://github.com/winner0988/mupdf-rs", rev = "206fd893e1cc8d6cc6facb8e520541e0f8ad88e0" }
mupdf-sys = { git = "https://github.com/winner0988/mupdf-rs", rev = "206fd893e1cc8d6cc6facb8e520541e0f8ad88e0" }
